name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: TASK_FABRIC_SVN_WORK_CONFIG=/nonexistent-tf-config cargo test --workspace

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Containment tests skip with a reason when bwrap cannot create
      # namespaces in the runner environment (bubblewrap is installed
      # above, but hosted runners restrict user namespaces).
      - name: Run Python tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
